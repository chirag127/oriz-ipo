name: ipo-gmp-watch

# Hourly IPO GMP scrape -> rank -> reviews -> notify -> commit data -> the
# committed JSON drives the CF Pages build. GitHub throttles high-freq cron, so
# we ask hourly + self-loop inside the run + allow manual/dispatch triggers.

on:
  schedule:
    - cron: '7 * * * *' # hourly at :07 (off the :00 stampede)
  workflow_dispatch:
  repository_dispatch:
    types: [tick]

permissions:
  contents: write

concurrency:
  group: ipo-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache yt-dlp + Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yt-dlp
            ~/.cache/ms-playwright
          key: ipo-tools-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ipo-tools-${{ runner.os }}-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser,dev]"

      - name: Install Playwright Chromium (for JS-rendered sources)
        run: python -m playwright install chromium --with-deps

      - name: Run tests
        run: python -m pytest -q

      - name: Scrape (self-loop ~3x to approximate sub-hourly)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
        run: |
          python -m ipo_watch \
            --data data \
            --content web/src/content/ipo \
            --iterations 3 --interval 60 -v

      - name: Commit data + generated posts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data web/src/content/ipo
          git diff --cached --quiet || git commit -m "data: IPO GMP scrape $(date -u +'%F %H:%MZ')"
          git push

      - name: Self re-dispatch heartbeat
        # GitHub cron fires late/sparse under load; re-arm a repository_dispatch
        # so the next tick is more likely to run near the hour.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "next tick armed by schedule; workflow_dispatch/repository_dispatch available for manual runs"
